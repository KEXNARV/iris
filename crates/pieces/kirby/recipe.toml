# Kirby in Dream Land: Iris's machinery underneath; the body (kirby.wasm) and everything around
# it (dreamland.wasm) drawn in code.

[recipe]
name = "kirby"
version = "1.0.0"
description = "Kirby en pixel art, a código: inhala mientras lee, salta al terminar, se pone sombrero al copiar y duerme con burbuja"

# ─── The script: how much of each thing shows in each state ─────────────────────────────────
# `default` holds every channel; each state lists only what changes. The script part eases each
# channel toward these values (a third of a second) when the state changes.

[script.default]
blob_r = 0.40
amp = 0.035
wob = 0.35
chaos = 0.1
arc_speed = 0.25
arcs = 1.0
arc_len = 1.0
ripple = 0.0
orbit = 0.0
sweep = 0.0
fill = 0.0
vu = 0.0
cardinal = 0.0
dashed = 0.0
scan = 0.0
stitch = 0.0
packets = 0.0
bud = 0.0
zzz = 0.0
pupil = 1.0
bob = 0.0
motes = 1.0
boot = 0.0
lens = 0.0
plan = 0.0
tests = 0.0
git = 0.0
press = 0.0
droop = 0.0
dilate = 1.0

[script.booting]
boot = 1.0
arc_speed = 0.5

[script.sleeping]
blob_r = 0.34
amp = 0.02
wob = 0.12
arcs = 0.0
pupil = 0.0
zzz = 1.0
motes = 0.3

[script.typing]
amp = 0.04
wob = 0.5
arc_speed = 0.4

[script.listening]
amp = 0.05
wob = 0.8
chaos = 0.5
arc_speed = 0.6
arc_len = 0.8
vu = 1.0
dilate = 1.3

[script.novoice]
amp = 0.025
wob = 0.3
arc_speed = 0.15
arc_len = 0.6
droop = 1.0
dilate = 1.4

[script.transcribing]
blob_r = 0.32
amp = 0.05
wob = 3.0
chaos = 0.9
arc_speed = 2.2
arc_len = 0.6
fill = 1.0

[script.thinking]
amp = 0.10
wob = 0.7
chaos = 0.3
arc_speed = 1.1
orbit = 1.0
dilate = 0.75

[script.planning]
amp = 0.04
wob = 0.5
arc_speed = 0.5
plan = 1.0

[script.searching]
amp = 0.03
wob = 0.5
arc_speed = 0.8
lens = 1.0

[script.reading]
amp = 0.03
wob = 0.4
arc_speed = 0.7
scan = 1.0

[script.editing]
amp = 0.05
wob = 0.9
arc_speed = 1.2
arc_len = 0.7
stitch = 1.0

[script.running]
blob_r = 0.38
amp = 0.08
wob = 2.0
chaos = 0.4
arc_speed = 2.4
arc_len = 0.7
sweep = 1.0

[script.testing]
amp = 0.04
wob = 1.0
arc_speed = 1.4
arc_len = 0.6
tests = 1.0

[script.git]
blob_r = 0.34
amp = 0.04
wob = 0.6
arc_speed = 0.6
git = 1.0

[script.web]
blob_r = 0.36
amp = 0.05
wob = 1.0
arc_speed = 0.8
packets = 1.0

[script.delegating]
blob_r = 0.36
amp = 0.06
wob = 0.8
arc_speed = 0.9
bud = 1.0

[script.speaking]
amp = 0.05
wob = 1.0
chaos = 0.2
arc_speed = 0.9
ripple = 1.0
dilate = 1.1

[script.asking]
blob_r = 0.38
amp = 0.03
wob = 0.3
arc_speed = 0.12
cardinal = 1.0
bob = 1.0

[script.compacting]
blob_r = 0.36
amp = 0.03
wob = 0.6
arc_speed = 1.6
arc_len = 0.5
press = 1.0

[script.offline]
blob_r = 0.30
amp = 0.015
wob = 0.0
chaos = 0.0
arc_speed = 0.0
arcs = 0.0
dashed = 1.0
pupil = 0.0
motes = 0.0

# ─── Parts, in the order they move, react and lay out ───────────────────────────────────────
# Iris's machinery (script, spring, flashes, rhythm, gestures, gaze, presence) moves the body;
# what's seen is Kirby's: its body, Dream Land around it, and the subagents as small Kirbys.

[[piece]]
use = "builtin:script"            # follows the script: the channels above, and the color
settings = { with_kids = { blob_r = 0.72, arcs = 0.45, motes = 0.5 } }   # steps aside for the kids

[[piece]]
use = "builtin:spring"            # the elastic squash everything pushes

[[piece]]
use = "builtin:flashes"           # what events and state changes leave: red, shake, deflate…

[[piece]]
use = "builtin:kids"              # the subagents: Waddle Dee allies in orbit
layer = 17

[[piece]]
use = "builtin:rhythm"            # the wobble and spin phases, the voice and the music

[[piece]]
use = "builtin:gestures"          # stretches, looks at the clock, yawns

[[piece]]
use = "builtin:gaze"              # where it looks

[[piece]]
use = "builtin:presence"          # where the body is this frame: drift, breath, beat, stretch

[[piece]]
use = "file:kirby.wasm"           # Kirby, dot by dot: its own pink, eyes, cheeks and feet
id = "body"
kid = false
layer = 16

[[piece]]
use = "file:ally.wasm"            # each subagent: a Waddle Dee ally, its bandana in its color
id = "ally"
kid = "only"

[[piece]]
use = "file:dreamland.wasm"       # Dream Land: star orbit, twinkling sky, each state's sign
id = "dreamland"
kid = false
layer = 2

# ─── Drawing order ──────────────────────────────────────────────────────────────────────────
# The allies (`kid = "only"`) are only drawn inside the subagents.
[draw]
order = ["body", "dreamland", "kids", "ally"]
