[package]
name = "stars"
version = "1.0.0"
edition = "2024"
description = "Star-shaped motes that flash on every event: an example piece for the store"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iris-piece = { path = "../../iris-piece" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Outside the Iris package: built separately, for wasm32-unknown-unknown.
[workspace]
