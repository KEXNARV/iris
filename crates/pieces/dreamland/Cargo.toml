[package]
name = "dreamland"
version = "1.0.0"
edition = "2024"
description = "Dream Land alrededor de Kirby: estrellas en órbita, cielo que titila y señales de cada estado"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iris-piece = { path = "../../iris-piece" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Outside the Iris package: built separately, for wasm32-unknown-unknown.
[workspace]
