[package]
name = "nucleo-wasm"
version = "0.1.0"
edition = "2024"
description = "El núcleo de Iris para la página: el mismo código que en la terminal, compilado a WASM"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
dirs = "6"
ratatui = { version = "0.30.2", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Fuera del workspace de Iris: se compila aparte, para wasm32-unknown-unknown.
[workspace]
