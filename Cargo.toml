[package]
name = "iris"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
crossterm = "0.29.0"
dirs = "6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
serde = "1.0.229"
serde_json = "1.0.151"
textwrap = "0.16.4"
unicode-width = "0.2.2"
wasmi = { version = "2", optional = true }
iris-pieza = { path = "crates/iris-pieza", optional = true }

# Whisper con Vulkan donde hay SDK a mano (Linux); en Windows, por ahora en CPU.
[target.'cfg(not(windows))'.dependencies]
whisper-rs = { version = "0.16.0", features = ["vulkan"] }

[target.'cfg(windows)'.dependencies]
whisper-rs = "0.16.0"


[features]
# El host de piezas en WebAssembly (la tienda). La web compila el mismo núcleo sin esto.
default = ["piezas"]
piezas = ["dep:wasmi", "dep:iris-pieza"]

[dev-dependencies]
wat = "1.261.0"
