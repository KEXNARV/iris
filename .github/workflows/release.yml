# Compila Iris para Linux y Windows. Con una etiqueta v* publica la versión en Releases, que es
# de donde bajan los instaladores de iris.knarvaez.com.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["release-ci"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VULKAN_SDK_VERSION: "1.4.309.0"
  # ggml (whisper) compila por defecto con -march=native: para la CPU del runner, que puede ser
  # un Xeon con AVX-512 y AMX. La v0.1.2 salió así y moría con "Illegal instruction" al cargar la
  # voz en cualquier CPU de escritorio o portátil sin AVX-512. whisper-rs-sys pasa las GGML_* al
  # CMake: piso fijo AVX2 + FMA + F16C (Intel desde 2013, AMD desde 2015), nada por encima.
  GGML_NATIVE: "OFF"
  GGML_AVX: "ON"
  GGML_AVX2: "ON"
  GGML_FMA: "ON"
  GGML_F16C: "ON"
  GGML_AVX512: "OFF"
  GGML_AVX_VNNI: "OFF"
  GGML_AMX_TILE: "OFF"
  GGML_AMX_INT8: "OFF"
  GGML_AMX_BF16: "OFF"

jobs:
  linux:
    # Ubuntu 22.04: glibc 2.35. Lo compilado aquí corre en Ubuntu 22.04+ y en Arch.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libvulkan-dev cmake clang libclang-dev
      - name: SDK de Vulkan (glslc y cabeceras nuevas para ggml)
        run: |
          curl -fsSL -o sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          mkdir -p "$HOME/vulkan" && tar -xf sdk.tar.xz -C "$HOME/vulkan"
          SDK="$HOME/vulkan/${VULKAN_SDK_VERSION}/x86_64"
          echo "VULKAN_SDK=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$SDK/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$SDK/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar
        run: cargo build --release --locked
      - name: Empaquetar
        run: |
          mkdir -p dist/iris
          cp target/release/iris dist/iris/
          strip dist/iris/iris
          tar -C dist -czf iris-linux-x86_64.tar.gz iris
          sha256sum iris-linux-x86_64.tar.gz > iris-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: iris-linux-x86_64.tar.gz*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar
        run: cargo build --release --locked
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\iris | Out-Null
          Copy-Item target\release\iris.exe dist\iris\
          Compress-Archive -Path dist\iris -DestinationPath iris-windows-x86_64.zip
          (Get-FileHash iris-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower() + "  iris-windows-x86_64.zip" | Out-File -Encoding ascii iris-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: iris-windows-x86_64.zip*

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Iris $GITHUB_REF_NAME" --generate-notes iris-*
      # Announces it (version.json): installed Iris builds offer the update. The notes are the
      # annotated tag's message, a line each after its title:
      #   git tag -a v0.1.6 -m "Iris 0.1.6" -m "First note" -m "Second note"
      # The token (IRIS_RELEASE_TOKEN) can only announce releases.
      - name: Announce
        env:
          GH_TOKEN: ${{ github.token }}
          IRIS_RELEASE_TOKEN: ${{ secrets.IRIS_RELEASE_TOKEN }}
        run: |
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          msg=""
          if [ "${obj%% *}" = "tag" ]; then msg=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${obj#* }" --jq .message); fi
          python3 - "${GITHUB_REF_NAME#v}" "$msg" > body.json <<'PY'
          import json, sys
          lines = [l.strip().lstrip("-•* ").strip() for l in sys.argv[2].splitlines()[1:]]
          print(json.dumps({"version": sys.argv[1], "notes": [l for l in lines if l]}, ensure_ascii=False))
          PY
          cat body.json
          curl -fsS -X POST https://iris.knarvaez.com/api/admin/iris/versions \
            -H "Authorization: Bearer $IRIS_RELEASE_TOKEN" -H "Content-Type: application/json" --data-binary @body.json
